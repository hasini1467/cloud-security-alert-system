services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: security-alert-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/certs:/app/certs:ro
    environment:
      - PORT=5000
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - LAMBDA_FUNCTION_NAME=${LAMBDA_FUNCTION_NAME:-s3-security-scanner}
      - AWS_IOT_ENDPOINT=${AWS_IOT_ENDPOINT:-}
      - MQTT_TOPIC=${MQTT_TOPIC:-s3/security/status}
      - SIMULATION_MODE=${SIMULATION_MODE:-true}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: security-alert-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
